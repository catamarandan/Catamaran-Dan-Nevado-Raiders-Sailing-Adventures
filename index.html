<style>
:root{
--hero-image:url("hero.png");
--hero-pos:center top;
--hero-size:cover;
--hero-minh:680px;
--bg:#0b1220;
--card:#101f3a;
--card2:#0f1b33;
--text:#eaf0ff;
--muted:#b8c6ef;
--line:rgba(255,255,255,.12);
--accent:#4da3ff;
--shadow:0 14px 34px rgba(0,0,0,.40);
--radius:18px;
--max:1200px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
margin:0;
font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--max);margin:0 auto;padding:22px 18px 60px}

/* NAV FIXED */
.site-nav{
display:flex;
justify-content:center;
gap:28px;
padding:14px 0 22px;
font-weight:600;
border-bottom:1px solid rgba(255,255,255,.12);
flex-wrap:wrap;
}
.site-nav a{opacity:.92;}
.site-nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px;}

.hero{
position:relative;
width:100vw;
margin-left:calc(50% - 50vw);
padding:84px 26px 74px;
background:
linear-gradient(180deg, rgba(11,18,32,.25), rgba(11,18,32,.92)),
var(--hero-image) var(--hero-pos) / var(--hero-size) no-repeat;
background-color:var(--bg);
min-height:var(--hero-minh);
}

.section-card{
background:linear-gradient(160deg,var(--card),var(--card2));
padding:28px 32px;
border-radius:var(--radius);
box-shadow:var(--shadow);
border:1px solid var(--line);
margin:26px 0 34px 0;
}

.row{
display:grid;
grid-template-columns:320px 1fr;
gap:14px;
border:1px solid var(--line);
border-radius:22px;
overflow:hidden;
background:linear-gradient(180deg,rgba(16,31,58,.92),rgba(15,27,51,.92));
box-shadow:var(--shadow);
}

.media{
padding:14px;
display:flex;
flex-direction:column;
gap:16px;
background:rgba(11,18,32,.35);
border-right:1px solid var(--line);
}

.shot img{width:100%;height:auto;display:block;}
.content{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;}
.title{margin:0;font-size:26px}
.desc{margin:0;font-size:16px;line-height:1.65}

@media(max-width:900px){
.row{grid-template-columns:1fr}
.media{border-right:none;border-bottom:1px solid var(--line)}
}
.footer{
margin-top:40px;
padding:28px 18px 34px;
border-top:1px solid var(--line);
text-align:center;
color:var(--muted);
}
</style>
</head>
