<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shop | Catamaran Dan</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Josefin+Sans:wght@300;400;600&display=swap');

:root{
--deep-ocean:#0a0f1a;
--midnight:#0d1520;
--aqua:#29b0d4;
--gold:#c9a84c;
--parchment:#f0e8d0;
--fog:#c8cdd8;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{
background:var(--deep-ocean);
color:var(--parchment);
font-family:'EB Garamond',serif;
}

nav{
background:#080c14;
border-bottom:1px solid rgba(201,168,76,0.2);
padding:1rem 2rem;
display:flex;
justify-content:center;
position:sticky;
top:0;
}

.nav-links{display:flex;gap:1.5rem;flex-wrap:wrap;}
nav a{
color:var(--fog);
font-family:'Josefin Sans';
text-transform:uppercase;
font-size:0.8rem;
letter-spacing:0.12em;
}
nav a.active{color:var(--gold);}

.page-hero{
min-height:45vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:linear-gradient(180deg,#050810 0%,#0a0f1a 100%);
padding:6rem 2rem;
}

.hero-h1{
font-family:'Cinzel';
font-size:clamp(2.5rem,6vw,4.5rem);
}

.hero-h1 em{color:var(--gold);font-style:normal;}

section{padding:5rem 2rem;}
.container{max-width:1100px;margin:0 auto;}

.section-label{
font-family:'Josefin Sans';
text-transform:uppercase;
letter-spacing:0.3em;
color:var(--aqua);
font-size:0.72rem;
}

.gold-rule{
width:60px;
height:2px;
background:linear-gradient(90deg,var(--gold),var(--old-gold));
margin:1rem 0 2rem;
}

.shop-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:2rem;
}

.product{
border:1px solid rgba(201,168,76,0.25);
background:rgba(14,77,110,0.12);
padding:1rem;
transition:0.3s;
}

.product:hover{
transform:translateY(-4px);
border-color:rgba(201,168,76,0.6);
}

.product img{
width:100%;
height:260px;
object-fit:cover;
margin-bottom:1rem;
}

.product-title{
font-family:'Cinzel';
font-size:1.1rem;
}

.btn-gold{
display:inline-block;
margin-top:0.8rem;
padding:0.6rem 1.2rem;
border:1px solid rgba(201,168,76,0.5);
color:var(--gold);
font-family:'Josefin Sans';
text-transform:uppercase;
letter-spacing:0.2em;
font-size:0.75rem;
text-decoration:none;
}

</style>
</head>

<body>

<nav>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="rimrun.html">Rim Run&#8482;</a>
<a href="shop.html" class="active">Shop</a>
</div>
</nav>

<div class="page-hero">
<h1 class="hero-h1">The <em>Shop</em></h1>
</div>

<section>
<div class="container">

<div class="section-label">Limited Editions</div>
<div class="gold-rule"></div>

<div class="shop-grid">

<!-- IMAGE 1 -->
<div class="product">
<img src="pbwf.png" alt="Print PBWF"/>
<div class="product-title">PBWF Edition</div>
<a class="btn-gold" href="#">Purchase</a>
</div>

<!-- IMAGE 2 -->
<div class="product">
<img src="pbwm.png" alt="Print PBWM"/>
<div class="product-title">PBWM Edition</div>
<a class="btn-gold" href="#">Purchase</a>
</div>

<!-- IMAGE 3 -->
<div class="product">
<img src="bullsharks.png" alt="Bull Sharks"/>
<div class="product-title">Bull Sharks Edition</div>
<a class="btn-gold" href="#">Purchase</a>
</div>

<!-- IMAGE 4 -->
<div class="product">
<img src="bbtb.png" alt="BBTB"/>
<div class="product-title">BBTB Edition</div>
<a class="btn-gold" href="#">Purchase</a>
</div>

</div>

</div>
</section>

</body>
</html>
